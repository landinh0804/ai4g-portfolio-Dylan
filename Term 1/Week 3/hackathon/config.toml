[theme]
# Light only, deliberately. The stylesheet in src/contract_trap_finder/ui.py is
# tuned for contrast on a warm off-white page, and a half-applied dark theme on a
# document people are reading carefully is worse than none.
base = "light"
primaryColor = "#DD1367"
backgroundColor = "#FBFAF8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16161A"
font = "sans-serif"

[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false
